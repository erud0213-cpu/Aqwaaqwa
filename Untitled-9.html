<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Натисни для перегляду секрету</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #111; display: flex; justify-content: center; 
            align-items: center; color: white; font-family: Arial, sans-serif; 
        }
        .btn { 
            padding: 20px 40px; font-size: 24px; color: white; 
            background: #ff0000; border: none; border-radius: 10px; 
            cursor: pointer; box-shadow: 0 5px 15px rgba(255,0,0,0.4);
            transition: 0.2s;
        }
        .btn:hover { transform: scale(1.05); background: #cc0000; }
    </style>
</head>
<body>

    <button class="btn" id="start">▶ Дивитися секретне відео від розробника</button>

    <script>
        document.getElementById('start').addEventListener('click', function() {
            // JavaScript миттєво відкриває оригінальне відео в новій вкладці
            window.open("https://youtube.com", "_blank");
        });
    </script>
</body>
</html>
